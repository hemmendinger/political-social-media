name: collect

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect.yml'  # a change to this file also runs it once (first run, manual re-runs)

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect
        run: python -m scripts.collect --summary-file "$RUNNER_TEMP/summary.txt"

      - name: Commit and push
        run: |
          git config user.name "truth-collector"
          git config user.email "actions@github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          msg=$(cat "$RUNNER_TEMP/summary.txt" 2>/dev/null || echo "collect: update")
          git commit -m "$msg"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
