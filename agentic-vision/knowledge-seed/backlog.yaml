  - id: B-029
    title: 'Deletion lookback gap: the removed search only covers posts created in the last 14 days'
    area: coverage
    priority: P0
    status: open
    phase: 0
    problem: 'trumpstruth''s /search date filter applies to the post''s creation date, not its removal date (the 2026-01-01..09-11
      window returned 88 of the 98 removals known from the 2022 window). The incremental collector searches only the
      last 14 days, so a removal of any post older than 14 days is never seen. 35 of the 98 deletions on record were
      older than 14 days at removal; going forward about a third of deletions would be missed and lifetime series
      would be right-censored at 14 days.

      '
    options:
    - name: search since 2022-01-01 on every run while total removals stay under about 500
      cost: S
      note: 1 page today (98 results per 100-row page); processed_removed_ids prevents re-fetching status pages; record
        the sweep window on the run record
    - name: 14-day daily plus a full sweep on Sundays
      cost: S
      note: cheaper as the removal count grows into several pages
    acceptance: coverage.removal_search.last_full_sweep is within 7 days on every run; a replay bundle with a removal
      of a 40-day-old post produces the deletion event
    cost:
      build: S
      requests: +0 to +4 per run
      wall: null
      profile: any
    blocked_by:
    - D-017
    evidence:
    - scripts/collect_trumpstruth.py:337-341
    - tests/fixtures/trumpstruth_search_removed_2026.html (88) vs MISTAKES.md (98)
    - data/deletions.jsonl ages
    decision: D-017
    opened: 2026-09-12
    closed: null
