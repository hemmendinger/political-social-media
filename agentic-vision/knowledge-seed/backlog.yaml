# knowledge/backlog.yaml (seed). Top-level: items (each per schemas/backlog-item.schema.json plus an optional `phase` from
# 10-migration-plan.md). One entry per known, unscheduled piece of work. `ts status` shows P0 items;
# `ts note backlog --close <id> --evidence "..."` closes one. Ordered by id; sort by priority to pick work.
#
# Ids B-001..B-010 migrate TODO.md; B-011..B-013 migrate the actionable rows of docs/dead-code-review.md;
# B-014..B-028 are findings of the 2026-09-12 audit (11-doc-deltas.md); B-101.. are the vision's own work
# items (10-migration-plan.md), listed here so the plan and the backlog are one thing.

items:
  - id: B-001
    title: "CNN archive: ambiguous repost handles (glued RT @handle prefix)"
    area: data-quality
    priority: P1
    status: open
    phase: 2
    problem: >
      The CNN archive stores a repost as `RT @<handle><text>` with no separator, so when the text starts with
      a word character the handle boundary is ambiguous. The merge never lets cnn override a handle known from
      the API or trumpstruth, so the damage is confined to cnn-only rows. Measured 2026-09-12: 1,157 of the
      1,172 rows the stat counts are self-reposts resolved by the exact-prefix rule (residual risk: a longer
      handle sharing the prefix); 15 have another handle glued, of which 8 are already known handles, 2 have a
      known handle as a proper prefix, and 5 are unknown (B-054 splits the stat).
    options:
      - {name: known-handle dictionary, cost: S, note: "longest known handle that is a prefix (fixes the 2 today); mark field_sources.reblog_of_acct = cnn-guess for the rest; offline"}
      - {name: trumpstruth cross-reference, cost: S, note: "one search per unresolved row (about 13 requests today), persisted, with repair provenance"}
      - {name: API account lookup, cost: M, note: "6 req/min, desktop only; last resort"}
    acceptance: "stats.cnn_ambiguous_handles.count == 0 after B-054 (the 15, not the 1,172), and no cnn-only reblog has a handle that is not a known Truth Social account"
    cost: {build: S, requests: "0 for option 1; ~13 for option 2", wall: "minutes", profile: any}
    blocked_by: ["B-054"]
    evidence: ["stats.cnn_ambiguous_handles", "knowledge/sources/cnn.md quirk 2026-09-11", "tests/fixtures/cnn_archive_sample.json"]
    decision: null
    opened: 2026-09-11
    closed: null

