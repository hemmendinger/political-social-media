# knowledge/backlog.yaml (seed). Top-level: items (each per schemas/backlog-item.schema.json plus an optional `phase` from
# 10-migration-plan.md). One entry per known, unscheduled piece of work. `ts status` shows P0 items;
# `ts note backlog --close <id> --evidence "..."` closes one. Ordered by id; sort by priority to pick work.
#
# Ids B-001..B-010 migrate TODO.md; B-011..B-013 migrate the actionable rows of docs/dead-code-review.md;
# B-014..B-028 are findings of the 2026-09-12 audit (11-doc-deltas.md); B-101.. are the vision's own work
# items (10-migration-plan.md), listed here so the plan and the backlog are one thing.

items:
  - id: B-001
    title: "CNN archive: ambiguous repost handles (glued RT @handle prefix)"
    area: data-quality
    priority: P0
    status: open
    phase: 2
    problem: >
      The CNN archive stores a repost as `RT @<handle><text>` with no separator, so when the text starts with
      a word character the handle boundary is ambiguous. The merge never lets cnn override a handle known from
      the API or trumpstruth, so the damage is confined to cnn-only rows: 1,172 reblogs today
      (stats.cnn_ambiguous_handles). For those rows reblog_of_acct may be wrong and content_text may be
      missing its first word.
    options:
      - {name: known-handle dictionary, cost: S, note: "longest known handle that is a prefix; mark field_sources.reblog_of_acct = cnn-guess otherwise; offline"}
      - {name: trumpstruth cross-reference, cost: M, note: "one status-page request per row, persisted; fixes the few hundred historical cases"}
      - {name: API account lookup, cost: L, note: "6 req/min, desktop only; last resort for the unresolved"}
    acceptance: "stats.cnn_ambiguous_handles.count == 0 and no cnn-only reblog has a handle that is not a known account"
    cost: {build: M, requests: "0 for option 1; ~1 per unresolved row for option 2", wall: "minutes", profile: "any (option 1); desktop or cloud (option 2)"}
    blocked_by: []
    evidence: ["stats.cnn_ambiguous_handles", "knowledge/sources/cnn.md quirk 2026-09-11", "tests/fixtures/cnn_archive_sample.json"]
    decision: null
    opened: 2026-09-11
    closed: null

  - id: B-002
    title: "Historical reposts before 2026-09-11 lack their own ids on trumpstruth listings"
    area: coverage
    priority: P1
    status: open
    phase: 3
    problem: >
      Listing pages render a repost as a ReTruthed label plus the target's card; a repost's own status id and
      time exist only on its own status page. Sequential resolution covers new ids going forward; historically
      reposts come from CNN, which de-duplicates repeated reposts of the same target.
    options:
      - {name: sequential crawl of ids 1..41,700 from the desktop, cost: L, note: "about 17 h of requests at 1.5 s; resumable; needs the cap exposed (B-027)"}
      - {name: API history backfill, cost: L, note: "resolves the same gap with richer fields; see B-003"}
    acceptance: "every reblog record from 2022-02 onward has its own ts_id and created_at_utc from trumpstruth or api (v_confidence.cnn_dedup_risk count == 0)"
    cost: {build: S, requests: "~41,700", wall: "~17 h", profile: desktop}
    blocked_by: ["B-027"]
    evidence: ["knowledge/sources/trumpstruth.md quirk (ReTruthed card)", "tests/fixtures/trumpstruth_listing_2026-09-09_cursor.html"]
    decision: null
    opened: 2026-09-11
    closed: null

  - id: B-003
    title: "Historical posts are presumed live; deletions before March 2026 are unknown (API backfill)"
    area: coverage
    priority: P1
    status: blocked
    phase: 3
    problem: >
      Posts known only from the archives carry status=present without last_verified_live_at. trumpstruth's
      removal tracking starts in March 2026 (98 removed posts total). Our present count exceeds the live
      statuses_count by about 350, which is the size of the unflagged historical deletions plus structural
      differences. A full API walk (about 1,830 pages at 5 requests per minute, about 6 hours, resumable)
      verifies every historical post and adds canonical fields.
    options:
      - {name: repair api-backfill from the desktop, cost: L, note: "commits in chunks; any archived post the live account no longer returns becomes a deletion with unknown timing (deleted_upper = observed_at)"}
    acceptance: "coverage.presumed_live_count == 0 and present_count_drift within tolerance"
    cost: {build: M, requests: "~1,830 + verifies", wall: "~6 h", profile: desktop}
    blocked_by: ["D-008"]
    evidence: ["stats.present_vs_api_statuses_count", "knowledge/sources/trumpstruth.md (removal tracking since 2026-03)"]
    decision: D-008
    opened: 2026-09-11
    closed: null

